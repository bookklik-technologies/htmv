<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seeded plugin · HTMV examples</title><link rel="icon" href="../shared/brand/icon.svg"><link rel="stylesheet" href="../shared/studio.css"></head><body>
  <hv-composition id="particles" width="1280" height="720" fps="30" duration="180f" background="#202122" seed="htmv-particles-v1">
    <hv-assets><hv-asset id="outfit" kind="font" src="../shared/brand/Outfit.ttf" family="Outfit" weight="700"></hv-asset></hv-assets>
    <style>
      .particles { position:absolute; left:0; top:0; width:1280px; height:720px; }
      .title { position:absolute; left:80px; top:250px; width:1120px; height:230px; font-family:Outfit; font-weight:700; font-size:100px; line-height:1.05; color:#ffffff; }
      .label { position:absolute; left:85px; top:110px; width:1100px; height:50px; font-family:Outfit; font-size:22px; color:#00ff99; }
    </style>
    <hv-scene duration="180f"><canvas class="particles" width="1280" height="720" data-hv-plugin="htmv-particles" data-hv-plugin-props='{"count":60}'></canvas><p class="label">SEEDED RANDOMNESS / FRAME-EXACT CANVAS PLUGIN</p><h1 class="title">Motion without<br>memory.</h1></hv-scene>
  </hv-composition>
  <script type="module" src="./app.js"></script>
</body></html>
